name: Build Flutter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Web build → deploys to GitHub Pages ──
  build_web:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Add web support
        run: flutter create . --platforms=web

      - name: Build web
        run: flutter build web --release --base-href "/milknote_flutter/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  # ── Android signed release AAB + APK ──
  build_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Add AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-7800736979145298~5787058699"/>\n    </application>|' $MANIFEST

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/milknote.jks
          echo "Keystore size: $(wc -c < android/app/milknote.jks) bytes"

      - name: Create key.properties
        run: |
          printf 'storePassword=${{ secrets.STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=milknote.jks\n' > android/key.properties
          echo "key.properties created:"
          cat android/key.properties

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=STORE_PASSWORD=${{ secrets.STORE_PASSWORD }} \
            -P android.injected.signing.store.file=$(pwd)/android/app/milknote.jks \
            -P android.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -P android.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -P android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            -P android.injected.signing.store.file=$(pwd)/android/app/milknote.jks \
            -P android.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -P android.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -P android.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: milknote-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (Direct install)
        uses: actions/upload-artifact@v4
        with:
          name: milknote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
