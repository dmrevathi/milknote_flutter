name: Build Flutter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Web build → deploys to GitHub Pages ──
  build_web:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Add web support
        run: flutter create . --platforms=web

      - name: Build web
        run: flutter build web --release --base-href "/milknote_flutter/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  # ── Android signed release AAB (Play Store) ──
  build_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Add Android support
        run: flutter create . --platforms=android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-7800736979145298~5787058699"/>\n    </application>|' $MANIFEST

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/milknote.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=milknote.jks
          KEYEOF

      - name: Configure signing in build.gradle
        run: |
          GRADLE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="android/app/build.gradle"
          fi
          echo "Using gradle file: $GRADLE"
          cat $GRADLE

          # Write signing setup script
          python3 << 'PYEOF'
          import re, os

          # Find correct gradle file
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          gradle_file = kts if os.path.exists(kts) else groovy
          is_kts = gradle_file.endswith('.kts')

          with open(gradle_file, 'r') as f:
              content = f.read()

          if is_kts:
              # Kotlin DSL
              keystore_props = '''
          val keystoreProperties = java.util.Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
          }

          '''
              signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              # Add keystore props before android {
              content = content.replace('android {', keystore_props + 'android {', 1)
              # Add signingConfigs before buildTypes
              content = content.replace('buildTypes {', signing_config + '    buildTypes {', 1)
              # Set release signing
              content = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  content, count=1
              )
          else:
              # Groovy DSL
              keystore_props = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
              signing_config = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              content = content.replace('android {', keystore_props + 'android {', 1)
              content = content.replace('buildTypes {', signing_config + '    buildTypes {', 1)
              content = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content, count=1
              )

          with open(gradle_file, 'w') as f:
              f.write(content)

          print(f'Configured signing in {gradle_file}')
          PYEOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: milknote-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (Direct install)
        uses: actions/upload-artifact@v4
        with:
          name: milknote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
